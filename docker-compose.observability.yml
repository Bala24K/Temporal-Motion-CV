# docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RECOGNIZER_MODE: ${RECOGNIZER_MODE:-rules}
  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./infrastructure/otel-collector.yml:/etc/otel/config.yml:ro"]
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infrastructure/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3001:3000"]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "false" }
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
