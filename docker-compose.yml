services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://fitness:fitness@db:5432/fitness
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16
    environment: {POSTGRES_USER: fitness, POSTGRES_PASSWORD: fitness, POSTGRES_DB: fitness}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fitness"], interval: 5s, retries: 10}
volumes: {pgdata: {}}
